{% extends base %}

{% block server -%}

    location / {
        proxy_pass http://unix:/run/app/app.sock;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }
    location /static/ {
        alias /opt/app/src/app/static/;
    }

{%- endblock %}
